# Toilet Manager, publié sur le port 3001 de l'hôte Docker.
# Nginx Proxy Manager (NPM) tourne dans un autre LXC : il joint ce conteneur
# via l'adresse IP du LXC Docker (réseau local), pas via un réseau Docker partagé.
#
# 1. docker compose up -d --build
# 2. Dans NPM, Proxy Host : scheme http, forward hostname/IP = IP du LXC Docker, port 3001
#    (HTTPS/Let's Encrypt et « Websockets » non requis, mais HTTPS obligatoire pour la PWA et les notifications).
# Pour restreindre l'accès à NPM seul, mettre l'IP du LXC Docker dans APP_BIND (ex. 192.168.1.20)
# et filtrer par pare-feu / règle LXC l'IP du LXC NPM.

name: toilet-manager

services:
  toilet-manager:
    build: .
    image: toilet-manager:latest
    container_name: toilet-manager
    restart: unless-stopped
    init: true
    environment:
      # Contact transmis aux services de push (adresse mail réelle recommandée).
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:toilet-manager@example.com}
    volumes:
      - toilet-data:/app/data
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3001}:3001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  # Base SQLite : à conserver (et sauvegarder) entre les mises à jour.
  toilet-data:
